name: n8n-mailtest

services:
  mailtest:
    image: greenmail/standalone:2.1.3
    container_name: n8n-mailtest
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:${MAILTEST_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${MAILTEST_IMAP_PORT:-3143}:3143"
      - "127.0.0.1:${MAILTEST_API_PORT:-8086}:8080"
    networks:
      servicedesk:
        aliases:
          - mailtest
          - n8n-mailtest

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: n8n-mailtest-webmail
    restart: unless-stopped
    depends_on:
      - mailtest
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: mailtest
      ROUNDCUBEMAIL_DEFAULT_PORT: 3143
      ROUNDCUBEMAIL_SMTP_SERVER: mailtest
      ROUNDCUBEMAIL_SMTP_PORT: 3025
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    ports:
      - "127.0.0.1:${MAILTEST_WEBMAIL_PORT:-8087}:80"
    networks:
      servicedesk:
        aliases:
          - webmail
          - n8n-mailtest-webmail

networks:
  servicedesk:
    external: true
    name: servicedesk-agents_default
