name: n8n-runtime

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: servicedesk-agents-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: servicedesk-agents-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://127.0.0.1:5678/}
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL:-http://127.0.0.1:5678/webhook}
      N8N_INTERNAL_WEBHOOK_BASE_URL: ${N8N_INTERNAL_WEBHOOK_BASE_URL:-http://127.0.0.1:5678/webhook}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-dev-n8n-webhook-token-local}
      N8N_INTERNAL_RUNBOOK_TOKEN: ${N8N_INTERNAL_RUNBOOK_TOKEN:-dev-n8n-internal-runbook-token-local}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WORKFLOW_DEBUG: ${N8N_WORKFLOW_DEBUG:-off}
      INTEGRATION_CALLBACK_TOKEN: ${INTEGRATION_CALLBACK_TOKEN:-dev-callback-token}
      CMDBUILD_BASE_URL: ${CMDBUILD_BASE_URL:-http://hostmachine:8090/cmdbuild}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "hostmachine:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - servicedesk
      - cmdbuild
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  n8n-data:
    external: true
    name: servicedesk-agents_n8n-data

networks:
  servicedesk:
    external: true
    name: servicedesk-agents_default
  cmdbuild:
    external: true
    name: cmdbuild_default
